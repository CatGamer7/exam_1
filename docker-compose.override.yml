services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app  # Hot-reloading for Python
    ports:
      - "8000:8000"

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app       # Hot-reloading for React
      - /app/node_modules     # Prevent local node_modules from overriding container's
    ports:
      - "5173:5173"           # Vite dev server port